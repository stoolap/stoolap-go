name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  STOOLAP_ENGINE_REF: v0.3.5

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            lib_file: libstoolap.dylib
          - host: macos-latest
            target: x86_64-apple-darwin
            lib_file: libstoolap.dylib
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib_file: libstoolap.so
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            lib_file: libstoolap.so
          - host: windows-latest
            target: x86_64-pc-windows-gnu
            lib_file: stoolap.dll

    name: Build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - name: Clone stoolap engine
        run: git clone --depth 1 --branch ${{ env.STOOLAP_ENGINE_REF }} https://github.com/stoolap/stoolap.git stoolap-engine

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Add MinGW to PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/msys64/mingw64/bin" >> $GITHUB_PATH

      - name: Install cross-compilation tools
        if: matrix.settings.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: stoolap-engine
          key: ${{ matrix.settings.target }}

      - name: Build stoolap shared library
        working-directory: stoolap-engine
        run: cargo build --release --features ffi --target ${{ matrix.settings.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Strip shared library (Unix)
        if: runner.os != 'Windows'
        run: |
          if [[ "${{ matrix.settings.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            aarch64-linux-gnu-strip -x stoolap-engine/target/${{ matrix.settings.target }}/release/${{ matrix.settings.lib_file }}
          else
            strip -x stoolap-engine/target/${{ matrix.settings.target }}/release/${{ matrix.settings.lib_file }}
          fi

      - name: Upload shared library
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.settings.target }}
          path: stoolap-engine/target/${{ matrix.settings.target }}/release/${{ matrix.settings.lib_file }}
          if-no-files-found: error

  test:
    name: Test - go${{ matrix.go }} (${{ matrix.settings.os }})
    needs: build
    strategy:
      fail-fast: true
      matrix:
        settings:
          - os: macos-latest
            artifact: lib-aarch64-apple-darwin
            lib_dir: lib/darwin_arm64
          - os: ubuntu-latest
            artifact: lib-x86_64-unknown-linux-gnu
            lib_dir: lib/linux_amd64
          - os: windows-latest
            artifact: lib-x86_64-pc-windows-gnu
            lib_dir: lib/windows_amd64
        go: ['1.24', '1.25', '1.26']
    runs-on: ${{ matrix.settings.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Download shared library
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.settings.artifact }}
          path: ${{ matrix.settings.lib_dir }}

      - name: Run tests
        shell: bash
        run: |
          export PATH="${{ github.workspace }}/${{ matrix.settings.lib_dir }}:$PATH"
          export LD_LIBRARY_PATH="${{ github.workspace }}/${{ matrix.settings.lib_dir }}"
          go vet ./...
          go test -v -count=1 ./...
        env:
          CGO_ENABLED: '1'

  release:
    name: Commit, Tag & Release
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download darwin arm64
        uses: actions/download-artifact@v4
        with:
          name: lib-aarch64-apple-darwin
          path: lib/darwin_arm64

      - name: Download linux amd64
        uses: actions/download-artifact@v4
        with:
          name: lib-x86_64-unknown-linux-gnu
          path: lib/linux_amd64

      - name: Download windows amd64
        uses: actions/download-artifact@v4
        with:
          name: lib-x86_64-pc-windows-gnu
          path: lib/windows_amd64

      - name: Update go.mod versions
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed -i "s|lib/darwin_arm64 v[0-9.]*|lib/darwin_arm64 v${VERSION}|" go.mod
          sed -i "s|lib/linux_amd64 v[0-9.]*|lib/linux_amd64 v${VERSION}|" go.mod
          sed -i "s|lib/windows_amd64 v[0-9.]*|lib/windows_amd64 v${VERSION}|" go.mod
          sed -i "s|stoolap-go v[0-9.]*|stoolap-go v${VERSION}|" example/benchmark/go.mod
          sed -i "s|lib/darwin_arm64 v[0-9.]*|lib/darwin_arm64 v${VERSION}|" example/benchmark/go.mod
          sed -i "s|lib/linux_amd64 v[0-9.]*|lib/linux_amd64 v${VERSION}|" example/benchmark/go.mod
          sed -i "s|lib/windows_amd64 v[0-9.]*|lib/windows_amd64 v${VERSION}|" example/benchmark/go.mod

      - name: Commit shared libraries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/ go.mod example/benchmark/go.mod
          git commit -m "Release v${{ steps.version.outputs.VERSION }} (stoolap ${{ env.STOOLAP_ENGINE_REF }})"
          git push origin main

      - name: Move tag and create lib tags
        run: |
          VERSION="v${{ steps.version.outputs.VERSION }}"
          # Move the main tag to include the shared libraries
          git tag -f "${VERSION}"
          git push origin "${VERSION}" --force
          # Create lib submodule tags
          git tag "lib/darwin_arm64/${VERSION}"
          git tag "lib/linux_amd64/${VERSION}"
          git tag "lib/windows_amd64/${VERSION}"
          git push origin "lib/darwin_arm64/${VERSION}" "lib/linux_amd64/${VERSION}" "lib/windows_amd64/${VERSION}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release

          declare -A NAMES=(
            ["aarch64-apple-darwin"]="libstoolap-darwin-arm64.dylib"
            ["x86_64-apple-darwin"]="libstoolap-darwin-x64.dylib"
            ["x86_64-unknown-linux-gnu"]="libstoolap-linux-x64.so"
            ["aarch64-unknown-linux-gnu"]="libstoolap-linux-arm64.so"
            ["x86_64-pc-windows-gnu"]="stoolap-windows-x64.dll"
          )

          for target in "${!NAMES[@]}"; do
            src=$(ls artifacts/lib-${target}/*)
            dest="release/${NAMES[$target]}"
            cp "$src" "$dest"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: release/*
