name: Update Static Libraries

on:
  workflow_dispatch:
    inputs:
      engine_ref:
        description: 'Stoolap engine git ref (tag, branch, or SHA)'
        required: true
        default: 'v0.3.5'

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            lib_dir: lib/darwin_arm64
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib_dir: lib/linux_amd64
          - host: windows-latest
            target: x86_64-pc-windows-gnu
            lib_dir: lib/windows_amd64

    name: Build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - name: Clone stoolap engine
        run: git clone --depth 1 --branch ${{ inputs.engine_ref }} https://github.com/stoolap/stoolap.git stoolap-engine

      - name: Enable staticlib output
        shell: bash
        working-directory: stoolap-engine
        run: sed -i.bak 's/crate-type = \["cdylib", "rlib"\]/crate-type = ["cdylib", "staticlib", "rlib"]/' Cargo.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Add MinGW to PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/msys64/mingw64/bin" >> $GITHUB_PATH

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: stoolap-engine
          key: ${{ matrix.settings.target }}

      - name: Build stoolap static library
        working-directory: stoolap-engine
        run: cargo build --release --features ffi --target ${{ matrix.settings.target }}

      - name: Strip static library (Unix)
        if: runner.os != 'Windows'
        run: strip -S stoolap-engine/target/${{ matrix.settings.target }}/release/libstoolap.a

      - name: Upload static library
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.settings.target }}
          path: stoolap-engine/target/${{ matrix.settings.target }}/release/libstoolap.a
          if-no-files-found: error

  commit:
    name: Commit Libraries
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download darwin arm64
        uses: actions/download-artifact@v4
        with:
          name: lib-aarch64-apple-darwin
          path: lib/darwin_arm64

      - name: Download linux amd64
        uses: actions/download-artifact@v4
        with:
          name: lib-x86_64-unknown-linux-gnu
          path: lib/linux_amd64

      - name: Download windows amd64
        uses: actions/download-artifact@v4
        with:
          name: lib-x86_64-pc-windows-gnu
          path: lib/windows_amd64

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          title: 'Update static libraries (stoolap ${{ inputs.engine_ref }})'
          body: |
            Updates bundled `libstoolap.a` static libraries to stoolap engine `${{ inputs.engine_ref }}`.

            Platforms:
            - darwin/arm64 (macOS Apple Silicon)
            - linux/amd64
            - windows/amd64 (MinGW)
          branch: update-libs-${{ inputs.engine_ref }}
          commit-message: 'Update static libraries to stoolap ${{ inputs.engine_ref }}'
