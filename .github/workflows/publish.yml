name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  STOOLAP_ENGINE_REF: v0.3.5

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-gnu

    name: Build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone stoolap engine
        run: git clone --depth 1 --branch ${{ env.STOOLAP_ENGINE_REF }} https://github.com/stoolap/stoolap.git stoolap-engine

      - name: Enable staticlib output
        shell: bash
        working-directory: stoolap-engine
        run: sed -i.bak 's/crate-type = \["cdylib", "rlib"\]/crate-type = ["cdylib", "staticlib", "rlib"]/' Cargo.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Add MinGW to PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/msys64/mingw64/bin" >> $GITHUB_PATH

      - name: Install cross-compilation tools
        if: matrix.settings.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: stoolap-engine
          key: ${{ matrix.settings.target }}

      - name: Build stoolap static library
        working-directory: stoolap-engine
        run: cargo build --release --features ffi --target ${{ matrix.settings.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Strip static library (Unix)
        if: runner.os != 'Windows'
        run: |
          if [[ "${{ matrix.settings.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            aarch64-linux-gnu-strip -S stoolap-engine/target/${{ matrix.settings.target }}/release/libstoolap.a
          else
            strip -S stoolap-engine/target/${{ matrix.settings.target }}/release/libstoolap.a
          fi

      - name: Upload static library
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.settings.target }}
          path: stoolap-engine/target/${{ matrix.settings.target }}/release/libstoolap.a
          if-no-files-found: error

  test:
    name: Test (${{ matrix.settings.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - os: macos-latest
            artifact: lib-aarch64-apple-darwin
            lib_dir: lib/darwin_arm64
          - os: ubuntu-latest
            artifact: lib-x86_64-unknown-linux-gnu
            lib_dir: lib/linux_amd64
          - os: windows-latest
            artifact: lib-x86_64-pc-windows-gnu
            lib_dir: lib/windows_amd64
    runs-on: ${{ matrix.settings.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download static library
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.settings.artifact }}
          path: ${{ matrix.settings.lib_dir }}

      - name: Run tests
        shell: bash
        run: go test -v -count=1 ./...
        env:
          CGO_ENABLED: '1'

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release

          declare -A NAMES=(
            ["aarch64-apple-darwin"]="libstoolap-darwin-arm64.a"
            ["x86_64-apple-darwin"]="libstoolap-darwin-x64.a"
            ["x86_64-unknown-linux-gnu"]="libstoolap-linux-x64.a"
            ["aarch64-unknown-linux-gnu"]="libstoolap-linux-arm64.a"
            ["x86_64-pc-windows-gnu"]="libstoolap-windows-x64.a"
          )

          for target in "${!NAMES[@]}"; do
            src=$(ls artifacts/lib-${target}/*)
            dest="release/${NAMES[$target]}"
            echo "Copying $src -> $dest"
            cp "$src" "$dest"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
