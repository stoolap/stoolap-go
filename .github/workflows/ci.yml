name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STOOLAP_ENGINE_REF: v0.4.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            lib_file: libstoolap.dylib
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib_file: libstoolap.so
          - host: windows-latest
            target: x86_64-pc-windows-gnu
            lib_file: stoolap.dll

    name: Build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - name: Clone stoolap engine
        run: git clone --depth 1 --branch ${{ env.STOOLAP_ENGINE_REF }} https://github.com/stoolap/stoolap.git stoolap-engine

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Add MinGW to PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/msys64/mingw64/bin" >> $GITHUB_PATH

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: stoolap-engine
          key: ${{ matrix.settings.target }}

      - name: Build stoolap shared library
        working-directory: stoolap-engine
        run: cargo build --release --features ffi --target ${{ matrix.settings.target }}

      - name: Fix macOS install name
        if: runner.os == 'macOS'
        run: install_name_tool -id @rpath/libstoolap.dylib stoolap-engine/target/${{ matrix.settings.target }}/release/${{ matrix.settings.lib_file }}

      - name: Strip shared library (macOS)
        if: runner.os == 'macOS'
        run: strip -x stoolap-engine/target/${{ matrix.settings.target }}/release/${{ matrix.settings.lib_file }}

      - name: Strip shared library (Linux/Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: strip stoolap-engine/target/${{ matrix.settings.target }}/release/${{ matrix.settings.lib_file }}

      - name: Upload shared library
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.settings.target }}
          path: stoolap-engine/target/${{ matrix.settings.target }}/release/${{ matrix.settings.lib_file }}
          if-no-files-found: error

  build-wasm:
    name: Build - wasm32-wasip1
    runs-on: ubuntu-latest
    steps:
      - name: Clone stoolap engine
        run: git clone --depth 1 --branch ${{ env.STOOLAP_ENGINE_REF }} https://github.com/stoolap/stoolap.git stoolap-engine

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install wasm-opt
        run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_121/binaryen-version_121-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_121/bin" >> $GITHUB_PATH

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: stoolap-engine
          key: wasm32-wasip1

      - name: Build stoolap WASM
        working-directory: stoolap-engine
        run: cargo build --profile max --target wasm32-wasip1 --features ffi --no-default-features

      - name: Optimize WASM
        run: wasm-opt -Oz stoolap-engine/target/wasm32-wasip1/max/stoolap.wasm -o stoolap.wasm

      - name: Show size
        run: ls -lh stoolap.wasm

      - name: Upload WASM
        uses: actions/upload-artifact@v4
        with:
          name: wasm-stoolap
          path: stoolap.wasm
          if-no-files-found: error

  test:
    name: Test Native - go${{ matrix.go }} (${{ matrix.settings.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - os: macos-latest
            artifact: lib-aarch64-apple-darwin
            lib_dir: lib/darwin_arm64
          - os: ubuntu-latest
            artifact: lib-x86_64-unknown-linux-gnu
            lib_dir: lib/linux_amd64
          - os: windows-latest
            artifact: lib-x86_64-pc-windows-gnu
            lib_dir: lib/windows_amd64
        go: ['1.24', '1.25', '1.26']
    runs-on: ${{ matrix.settings.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Download shared library
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.settings.artifact }}
          path: ${{ matrix.settings.lib_dir }}

      - name: Run tests
        shell: bash
        run: |
          export PATH="${{ github.workspace }}/${{ matrix.settings.lib_dir }}:$PATH"
          export LD_LIBRARY_PATH="${{ github.workspace }}/${{ matrix.settings.lib_dir }}"
          go test -v -count=1 ./...
        env:
          CGO_ENABLED: '0'

  test-wasm:
    name: Test WASM - go${{ matrix.go }}
    needs: build-wasm
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24', '1.25', '1.26']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Download WASM
        uses: actions/download-artifact@v4
        with:
          name: wasm-stoolap
          path: wasm

      - name: Run WASM driver tests
        working-directory: wasm
        run: |
          go test -v -count=1 -cover ./...
        env:
          STOOLAP_WASM: stoolap.wasm
          CGO_ENABLED: '0'
